# Local reverse-proxy gateway combining the Vite dev server and FastAPI under
# one origin, so frpc only needs to tunnel a single port to the remote frps
# server (see infra/frp/frpc.toml and AGENTS.md's M7 section).
#
# frps overwrites X-Forwarded-Proto based on its OWN connection to it (always
# plain http — the remote nginx terminates TLS and forwards to frps as plain
# HTTP, same as every other *.wizbase.ai.kr site here), so trying to pass an
# incoming X-Forwarded-Proto through the tunnel doesn't work: frp replaces it
# regardless of what the real client used (verified empirically — do not
# "fix" this by trying to forward the header again). Derive the scheme from
# the Host header instead: this deployment's topology is fixed and known —
# the public domain is only ever reachable over HTTPS (the remote nginx
# force-redirects http->https at its edge, matching every other domain's
# config on that server), so seeing that Host means it came in as HTTPS.
map $http_host $forwarded_proto {
    default                          $scheme;
    "alps-twin.wizbase.ai.kr"        https;
}

server {
    listen 127.0.0.1:8090;
    server_name alps-twin.wizbase.ai.kr localhost;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
    }

    # Keycloak paths proxied under the SAME origin as the app (not a separate
    # host) — the browser must be able to reach the OIDC login/JWKS endpoints
    # wherever it's viewing the app from, including over the public tunnel
    # where "localhost:8081" means nothing. See AGENTS.md M7 section.
    location /realms/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /resources/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
    }

    location /robots.txt {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Vite HMR websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
