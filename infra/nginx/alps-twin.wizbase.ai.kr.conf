# Deploy target: /etc/nginx/sites-available/alps-twin.wizbase.ai.kr on
# 140.238.31.159, symlinked into sites-enabled — matches the exact pattern
# of every other *.wizbase.ai.kr site on this server (all proxy to the frps
# vhost port; frps routes to the right frpc tunnel by Host header).
#
# Deploy sequence (run once DNS for alps-twin.wizbase.ai.kr -> 140.238.31.159
# has propagated — verify with `dig +short alps-twin.wizbase.ai.kr` first):
#
#   scp this file ubuntu@140.238.31.159:/tmp/alps-twin.wizbase.ai.kr.conf
#   ssh ubuntu@140.238.31.159
#   sudo mv /tmp/alps-twin.wizbase.ai.kr.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/alps-twin.wizbase.ai.kr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d alps-twin.wizbase.ai.kr
#     (certbot rewrites this file in place to add the 443/TLS block and the
#     301 redirect, exactly like it did for every other domain here — do not
#     hand-write the ssl_certificate lines yourself, let certbot generate them)

server {
    listen 80;
    server_name alps-twin.wizbase.ai.kr;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
